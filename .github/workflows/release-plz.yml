name: Release-plz

# How this works (see https://release-plz.dev/docs/github/quickstart):
#
# 1. On every push to `master` the `release-pr` job opens/updates a release PR
#    (branch prefix `release-plz-`) with the version bump and changelog for the
#    `rust-cktap` crate, authored by the `bitcoindevkit-release-plz` GitHub App.
# 2. When that release PR is merged, the `release` job publishes the crate to
#    crates.io (via trusted publishing / OIDC, no token secret) and creates the
#    `rust-cktap-vX.Y.Z` git tag and GitHub release.
# 3. The `release` job runs in the `release` GitHub environment, whose required
#    reviewers are the @bitcoindevkit/rust-cktap-maintainers team: publishing
#    waits until a team member approves it in the Actions UI.
#    `workflow_dispatch` is a manual escape hatch (publishes the version
#    currently in Cargo.toml) and is gated by the same approval.

on:
  push:
    branches:
      - 'master'
  pull_request:
    types:
      - closed
    branches:
      - 'master'
  workflow_dispatch:

permissions: {}

jobs:
  # Create/update the PR with the new version and changelog.
  release-pr:
    name: Create Rust Release PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'bitcoindevkit' && github.event_name != 'pull_request' }}
    permissions:
      contents: write # push the release PR branch
      pull-requests: write # open and update the release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Publish to crates.io, tag, and create the GitHub release once the release
  # PR is merged (or on manual dispatch). Gated by the `release` environment.
  release:
    name: Publish Rust Release
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'bitcoindevkit' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-plz-')))
    environment: release
    permissions:
      contents: write # push tags and create GitHub releases
      pull-requests: read # detect the merged release PR
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # No CARGO_REGISTRY_TOKEN on purpose: crates.io trusted publishing is
          # configured for this repo + workflow + the `release` environment.
